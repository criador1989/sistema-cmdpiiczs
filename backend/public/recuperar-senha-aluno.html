<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recuperar senha • Axoriin Portal do Aluno</title>
  <style>
    :root{--bg:#080b1c;--card:#111831;--line:#29345f;--txt:#f1f3ff;--muted:#aab4d6;--acc:#8068ff;--ok:#43d99d}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;
    font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt);
    background:radial-gradient(circle at 20% 15%,rgba(128,104,255,.2),transparent 35%),var(--bg)}
    .card{width:min(480px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;
    box-shadow:0 24px 70px rgba(0,0,0,.3)}
    h1{margin:0 0 8px;font-size:29px}.lead{color:var(--muted);line-height:1.5;margin:0 0 22px}
    label{display:block;font-weight:800;margin:15px 0 7px}input{width:100%;padding:13px 14px;border-radius:12px;
    border:1px solid #354273;background:#0a1027;color:var(--txt);font:inherit}
    button{width:100%;border:0;border-radius:12px;padding:13px;margin-top:20px;background:var(--acc);color:white;font:inherit;font-weight:900;cursor:pointer}
    button:disabled{opacity:.55}.msg{display:none;margin-top:16px;padding:13px;border-radius:12px;background:rgba(67,217,157,.08);border:1px solid rgba(67,217,157,.3);line-height:1.45}
    .msg.show{display:block}.links{text-align:center;margin-top:18px}.links a{color:#bcb2ff;text-decoration:none;font-weight:800}
    .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
  </style>
</head>
<body>
  <main class="card">
    <h1>Esqueceu sua senha?</h1>
    <p class="lead">
      Informe seu código de acesso e o e-mail de recuperação que você confirmou no Portal do Aluno.
    </p>

    <form id="form">
      <label for="codigo">Código de acesso</label>
      <input id="codigo" autocomplete="username" required placeholder="Ex.: 2J8HOUJ7">

      <label for="email">E-mail de recuperação</label>
      <input id="email" type="email" autocomplete="email" required placeholder="seuemail@exemplo.com">
      <div class="hint">Pode ser o seu e-mail ou o e-mail de recuperação de um responsável.</div>

      <button id="btn" type="submit">Enviar link de recuperação</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="links">
      <a href="/login-aluno.html">← Voltar ao Portal do Aluno</a>
    </div>
  </main>

  <script>
    (() => {
      const form = document.getElementById('form');
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = 'Enviando...';

        try {
          const r = await fetch('/api/aluno-recuperacao/solicitar-reset', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              codigoAcesso: document.getElementById('codigo').value.trim(),
              emailRecuperacao: document.getElementById('email').value.trim()
            })
          });

          const data = await r.json().catch(() => ({}));
          msg.className = 'msg show';
          msg.textContent = data.mensagem ||
            'Se os dados corresponderem a uma conta protegida, enviaremos um link.';
        } catch {
          msg.className = 'msg show';
          msg.textContent =
            'Se os dados corresponderem a uma conta protegida, enviaremos um link.';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Enviar link de recuperação';
        }
      });
    })();
  </script>
</body>
</html>
