<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Criar nova senha • Axoriin</title>
  <style>
    :root{--bg:#080b1c;--card:#111831;--line:#29345f;--txt:#f1f3ff;--muted:#aab4d6;--acc:#8068ff;--ok:#43d99d;--bad:#ff7888}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;
    font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt);
    background:radial-gradient(circle at 20% 15%,rgba(128,104,255,.2),transparent 35%),var(--bg)}
    .card{width:min(480px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;
    box-shadow:0 24px 70px rgba(0,0,0,.3)}h1{margin:0 0 8px;font-size:29px}
    .lead{color:var(--muted);line-height:1.5;margin:0 0 22px}label{display:block;font-weight:800;margin:15px 0 7px}
    input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #354273;background:#0a1027;color:var(--txt);font:inherit}
    button{width:100%;border:0;border-radius:12px;padding:13px;margin-top:20px;background:var(--acc);color:white;font:inherit;font-weight:900;cursor:pointer}
    button:disabled{opacity:.55}.msg{display:none;margin-top:16px;padding:13px;border-radius:12px;line-height:1.45}
    .msg.show{display:block}.msg.ok{border:1px solid rgba(67,217,157,.3);background:rgba(67,217,157,.08)}
    .msg.bad{border:1px solid rgba(255,120,136,.3);background:rgba(255,120,136,.08)}
    .links{text-align:center;margin-top:18px}.links a{color:#bcb2ff;text-decoration:none;font-weight:800}
    .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
  </style>
</head>
<body>
  <main class="card">
    <h1>Crie sua nova senha</h1>
    <p class="lead">Escolha uma senha nova para o Axoriin • Portal do Aluno.</p>

    <form id="form">
      <label for="senha">Nova senha</label>
      <input id="senha" type="password" autocomplete="new-password" required minlength="8">

      <label for="confirmar">Confirmar nova senha</label>
      <input id="confirmar" type="password" autocomplete="new-password" required minlength="8">
      <div class="hint">Use uma senha que você não utilize em outros serviços.</div>

      <button id="btn" type="submit">Salvar nova senha</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="links">
      <a href="/login-aluno.html">← Voltar ao login</a>
    </div>
  </main>

  <script>
    (() => {
      const token = new URLSearchParams(location.search).get('token') || '';
      const form = document.getElementById('form');
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');

      const show = (text, type) => {
        msg.className = `msg show ${type}`;
        msg.textContent = text;
      };

      if (!token) {
        show('Link de redefinição inválido. Solicite uma nova recuperação.', 'bad');
        form.style.display = 'none';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const senha = document.getElementById('senha').value;
        const confirmar = document.getElementById('confirmar').value;

        if (senha !== confirmar) {
          show('As senhas não coincidem.', 'bad');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Salvando...';

        try {
          const r = await fetch('/api/aluno-recuperacao/redefinir', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, novaSenha: senha })
          });

          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(data.mensagem || 'Não foi possível redefinir a senha.');

          form.style.display = 'none';
          show(data.mensagem || 'Senha alterada com sucesso.', 'ok');

          setTimeout(() => {
            location.href = '/login-aluno.html';
          }, 2200);
        } catch (e) {
          show(e.message || 'Não foi possível redefinir a senha.', 'bad');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Salvar nova senha';
        }
      });
    })();
  </script>
</body>
</html>
