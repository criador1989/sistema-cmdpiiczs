<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axoriin • Nova senha</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--blue:#0b63c7;--blue2:#1683f5;--navy:#0c2340;--muted:#687789;--line:#dce6f2;--ok:#128c55;--danger:#d93f4c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eaf4ff,#f8fbff);font-family:Inter,sans-serif}.card{width:min(100%,520px);background:#fff;border:1px solid #dfeaf6;border-radius:26px;padding:38px;box-shadow:0 24px 70px rgba(12,45,92,.16)}h1{color:var(--navy);font-size:30px;margin:0 0 9px}p{color:var(--muted);line-height:1.55}.field{margin:18px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:8px}.field input{width:100%;height:54px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font:500 15px Inter,sans-serif;outline:none}.field input:focus{border-color:#5aa8f8;box-shadow:0 0 0 4px rgba(22,131,245,.1)}button,.link{width:100%;height:52px;border:0;border-radius:14px;font-weight:800;font-size:15px;display:grid;place-items:center;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}.link{display:none;margin-top:10px;background:#eef4fb;color:#36516f}.feedback{display:none;margin-top:16px;padding:13px;border-radius:14px;font-size:14px;font-weight:600;line-height:1.45}.feedback.show{display:block}.feedback.error{background:#fff0f2;color:var(--danger)}.feedback.success{background:#effaf5;color:var(--ok)}button:disabled{opacity:.65}@media(max-width:540px){.card{padding:28px 20px}}
</style></head><body><main class="card"><h1>Crie sua nova senha</h1><p>Use uma senha com pelo menos 8 caracteres, incluindo letra maiúscula, minúscula e número.</p><form id="form"><div class="field"><label for="senha">Nova senha</label><input id="senha" type="password" autocomplete="new-password" required minlength="8"></div><div class="field"><label for="confirmar">Confirme a nova senha</label><input id="confirmar" type="password" autocomplete="new-password" required minlength="8"></div><button id="btn" class="primary" type="submit">Salvar nova senha</button><a id="login" class="link" href="login-aluno.html">Entrar no Portal do Aluno</a><div id="feedback" class="feedback"></div></form></main><script>
(function(){const p=new URLSearchParams(location.search),token=(p.get('token')||'').trim(),t=(p.get('t')||'').trim(),form=document.getElementById('form'),btn=document.getElementById('btn'),fb=document.getElementById('feedback'),login=document.getElementById('login');function url(path){return t?path+(path.includes('?')?'&':'?')+'t='+encodeURIComponent(t):path}if(t)login.href=url('login-aluno.html');function msg(x,type){fb.textContent=x;fb.className='feedback show '+type}if(!token){msg('Este link de redefinição é inválido. Solicite um novo link na tela de login.','error');btn.disabled=true}form.addEventListener('submit',async e=>{e.preventDefault();const s=document.getElementById('senha').value,c=document.getElementById('confirmar').value;if(s!==c){msg('As senhas não coincidem.','error');return}btn.disabled=true;btn.textContent='Salvando...';try{const payload={token,senha:s};if(t){payload.t=t;payload.tenant=t}const r=await fetch(url('/auth/aluno-senha/redefinir'),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok){msg(d.mensagem||'Não foi possível redefinir a senha.','error');return}msg('Senha redefinida com sucesso. Você já pode entrar no Portal do Aluno.','success');login.style.display='grid';btn.style.display='none'}catch(e){msg('Erro de conexão. Tente novamente.','error')}finally{if(btn.style.display!=='none'){btn.disabled=false;btn.textContent='Salvar nova senha'}}})})();
</script></body></html>
