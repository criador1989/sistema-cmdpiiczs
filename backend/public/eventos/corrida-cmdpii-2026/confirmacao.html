<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Validar cartão | Axoriin Eventos</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oxanium:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/eventos.css"></head><body class="v130"><header class="topbar"><div class="wrap nav"><a class="brand" href="./">AXORIIN<small>EVENTOS</small></a><a class="account-btn" href="./">Página da corrida</a></div></header><main class="wrap"><section class="confirm-verify130"><div class="eyebrow">VALIDAÇÃO DO CARTÃO</div><h1 id="title">Verificando...</h1><div id="data"></div></section></main><script src="assets/js/common.js"></script><script>(async()=>{const t=new URLSearchParams(location.search).get('t');if(!t){title.textContent='QR inválido';return}try{const d=await api(`/confirmacao/validar?token=${encodeURIComponent(t)}`);title.innerHTML='<span class="valid130">✓ Inscrição válida e deferida</span>';data.innerHTML=`<p><b>Participante:</b> ${esc(d.nome)}</p><p><b>Número de peito:</b> ${esc(d.numeroPeito)}</p><p><b>Categoria:</b> ${esc(d.categoria)}</p><p><b>Pagamento:</b> ${esc(d.pagamento)}</p><p><b>Kit:</b> ${esc(d.kitStatus)}</p>`}catch(e){title.textContent='Cartão inválido ou expirado';data.textContent=e.message}})();</script></body></html>
