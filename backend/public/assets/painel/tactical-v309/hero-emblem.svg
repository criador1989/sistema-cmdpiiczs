<svg width="720" height="520" viewBox="0 0 720 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gA" x1="210" y1="92" x2="510" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7FFE7"/>
      <stop offset="0.34" stop-color="#56F2C5"/>
      <stop offset="0.68" stop-color="#21CDAA"/>
      <stop offset="1" stop-color="#0B8F7B"/>
    </linearGradient>
    <linearGradient id="gOrbit" x1="130" y1="110" x2="600" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62F7D3" stop-opacity="0.12"/>
      <stop offset="0.48" stop-color="#8FFFE8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#32A8C6" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 260) rotate(90) scale(222 244)">
      <stop stop-color="#49F2C8" stop-opacity="0.2"/>
      <stop offset="0.58" stop-color="#2AD8B5" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <ellipse cx="360" cy="260" rx="244" ry="222" fill="url(#gGlow)"/>

  <!-- tactical globe / radar -->
  <circle cx="360" cy="260" r="170" stroke="#69F4D3" stroke-opacity="0.12"/>
  <circle cx="360" cy="260" r="143" stroke="#69F4D3" stroke-opacity="0.10" stroke-dasharray="5 10"/>
  <circle cx="360" cy="260" r="116" stroke="#69F4D3" stroke-opacity="0.08"/>
  <path d="M191 260H529" stroke="#69F4D3" stroke-opacity="0.08"/>
  <path d="M360 91V429" stroke="#69F4D3" stroke-opacity="0.08"/>
  <ellipse cx="360" cy="260" rx="74" ry="170" stroke="#69F4D3" stroke-opacity="0.08"/>
  <ellipse cx="360" cy="260" rx="138" ry="170" stroke="#69F4D3" stroke-opacity="0.06"/>

  <!-- orbital rings -->
  <g filter="url(#glow)">
    <ellipse cx="360" cy="260" rx="250" ry="91" transform="rotate(-17 360 260)" stroke="url(#gOrbit)" stroke-width="3"/>
    <ellipse cx="360" cy="260" rx="232" ry="72" transform="rotate(29 360 260)" stroke="#57E7C6" stroke-opacity="0.26" stroke-width="1.4" stroke-dasharray="10 12"/>
  </g>
  <circle cx="583" cy="190" r="6" fill="#8AFFE2" filter="url(#glow)"/>
  <circle cx="157" cy="326" r="4" fill="#46DAB9" filter="url(#glow)"/>

  <!-- clean Axoriin A mark -->
  <g filter="url(#glow)">
    <path d="M359.9 111L506 406H445L359.8 232L274.6 406H214L359.9 111Z" fill="url(#gA)"/>
    <path d="M359.8 247L410 348H309L359.8 247Z" fill="#061B17" fill-opacity="0.92"/>
    <path d="M359.8 276L389 335H330L359.8 276Z" fill="#5BF4CF" fill-opacity="0.93"/>
    <path d="M359.8 293L376 326H344L359.8 293Z" fill="#D6FFF3" fill-opacity="0.62"/>
  </g>

  <!-- restrained HUD ticks -->
  <g stroke="#63F3D0" stroke-opacity="0.18">
    <path d="M360 55V74"/><path d="M360 446V465"/><path d="M155 260H174"/><path d="M546 260H565"/>
    <path d="M215 115L228 128"/><path d="M492 392L505 405"/><path d="M505 115L492 128"/><path d="M228 392L215 405"/>
