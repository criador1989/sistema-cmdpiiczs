<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020817}body{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#f6fbff}.scene{position:fixed;inset:0;display:grid;place-items:center;isolation:isolate;background:#020817;opacity:0;transition:opacity .55s ease}.scene.ready{opacity:1}.bg{position:absolute;inset:-2%;z-index:-5;background:url('/assets/painel/galaxia/living/intro-desktop.webp') center/cover no-repeat;filter:brightness(.52) saturate(1);transform:scale(1.025)}.veil{position:absolute;inset:0;z-index:-3;background:radial-gradient(circle at 50% 50%,transparent 0 20%,rgba(2,8,20,.30) 58%,rgba(1,4,12,.76) 100%)}.card{position:relative;width:min(92vw,760px);padding:38px 34px 32px;text-align:center;border:1px solid rgba(117,213,255,.24);border-radius:32px;background:linear-gradient(145deg,rgba(4,18,42,.68),rgba(6,10,30,.78));box-shadow:0 34px 90px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(16px);overflow:hidden}.orbital{position:relative;width:190px;height:190px;margin:-6px auto 4px;display:grid;place-items:center}.ring{position:absolute;inset:-5%;width:110%;height:110%;object-fit:contain;opacity:.68;animation:spin 22s linear infinite}.orb{width:60%;height:60%;object-fit:contain;filter:drop-shadow(0 0 30px rgba(75,211,255,.48));animation:float 4.6s ease-in-out infinite}.eyebrow{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.28em;color:#7ceaff}h1{margin:10px 0 0;font-size:clamp(2rem,4.4vw,3.55rem);line-height:1;letter-spacing:-.04em}h1 span{background:linear-gradient(90deg,#73eaff,#86b9ff 48%,#9f84ff);-webkit-background-clip:text;background-clip:text;color:transparent}p{margin:14px auto 0;max-width:545px;font-size:1rem;line-height:1.52;color:rgba(221,235,255,.72)}.progress{width:min(72vw,420px);height:3px;margin:24px auto 0;background:rgba(142,211,255,.10);overflow:hidden;border-radius:99px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#59e4ff,#3f91ff,#8b70ff);animation:load 4.2s linear forwards}.status{margin-top:11px;font-size:.84rem;color:rgba(210,230,255,.58)}.skip{margin-top:16px;border:1px solid rgba(128,211,255,.20);background:rgba(6,18,40,.35);color:rgba(225,240,255,.70);border-radius:999px;padding:9px 14px;font:600 .72rem/1 Inter,"Segoe UI",sans-serif;cursor:pointer}.curtain{position:absolute;inset:0;z-index:40;pointer-events:none;background:#020817;opacity:0;transition:opacity .8s ease}body.leaving .curtain{opacity:1}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-7px) scale(1.025)}}@keyframes load{to{width:100%}}@media(max-width:700px){.bg{background-image:url('/assets/painel/galaxia/living/intro-mobile.webp');background-position:center 58%}.card{padding:27px 20px 24px;border-radius:26px}.orbital{width:160px;height:160px}}@media(prefers-reduced-motion:reduce){.ring,.orb{animation:none!important}.progress i{animation:none!important;width:100%}.scene,.curtain{transition-duration:.35s!important}}
</style>

</head><body><main class="scene" id="scene"><div class="bg" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div><section class="card"><div class="orbital" aria-hidden="true"><img class="ring" src="/assets/painel/galaxia/living/portal-ring.png" alt=""><img class="orb" src="/assets/painel/galaxia/living/axoriin-orb.png" alt=""></div><div class="eyebrow">Acesso confirmado</div><h1>Bem-vindo(a) ao <span>Axoriin.</span></h1><p>O eixo que organiza e ilumina a gestão educacional. Seu ambiente institucional está pronto.</p><div class="progress"><i></i></div><div class="status" id="status">Preparando o painel principal…</div><button class="skip" id="skip" type="button">Abrir agora</button></section><div class="curtain" aria-hidden="true"></div></main>
<script>(()=>{const q=new URLSearchParams(location.search);const tenant=q.get('t')||localStorage.getItem('tenantSlug')||localStorage.getItem('tenant')||'';let next=q.get('next')||'/painel.html';try{const u=new URL(next,location.origin);next=u.origin===location.origin?(u.pathname+u.search+u.hash):'/painel.html'}catch{next='/painel.html'}if(!next.startsWith('/')||next.startsWith('//'))next='/painel.html';if(tenant){const u=new URL(next,location.origin);if(!u.searchParams.get('t'))u.searchParams.set('t',tenant);next=u.pathname+u.search+u.hash}const scene=document.getElementById('scene');requestAnimationFrame(()=>scene.classList.add('ready'));let leaving=false;function go(){if(leaving)return;leaving=true;sessionStorage.setItem('axoriin:cinematic-arrival','1');document.body.classList.add('leaving');setTimeout(()=>location.replace(next),850)}document.getElementById('skip').addEventListener('click',go);setTimeout(()=>{document.getElementById('status').textContent='Tudo pronto.'},2600);setTimeout(go,4700)})();</script>
