<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Resultados | Axoriin Eventos</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oxanium:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/admin.css"></head><body><div class="admin-shell"><div id="side"></div><main class="admin-main"><div class="admin-top"><div><div class="eyebrow">GESTÃO DO EVENTO</div><h1>Resultados</h1><p>Cadastre manualmente ou importe CSV.</p></div><div class="save-state" id="saveState">Pronto</div></div><div class="admin-grid"><section class="admin-card panel"><h2>Lançamento manual</h2><div class="form-grid"><div class="field"><label>Número de peito</label><input id="numeroPeito"></div><div class="field"><label>Tempo (HH:MM:SS)</label><input id="tempo" placeholder="00:24:18"></div><div class="field"><label>Colocação geral</label><input id="colocacaoGeral" type="number"></div><div class="field"><label>Colocação na categoria</label><input id="colocacaoCategoria" type="number"></div><div class="field"><label>Distância (km)</label><input id="distanciaKm" type="number" step="0.1"></div><div class="field"><label>Status</label><select id="status"><option value="concluido">Concluído</option><option value="dnf">DNF</option><option value="dns">DNS</option><option value="desclassificado">Desclassificado</option></select></div></div><button class="btn primary" id="save">Salvar resultado</button></section><aside class="admin-card panel"><h2>Importar CSV</h2><p style="color:var(--muted)">Cabeçalhos: numeroPeito, tempo, colocacaoGeral, colocacaoCategoria, distanciaKm, status</p><input id="csv" type="file" accept=".csv,text/csv"><button class="btn secondary" id="importBtn" style="margin-top:14px">Importar arquivo</button></aside></div><section class="section"><h2 class="section-title">RESULTADOS CADASTRADOS</h2><div class="table-wrap"><table class="table"><thead><tr><th>Geral</th><th>Nº</th><th>Participante</th><th>Categoria</th><th>Tempo</th><th>Cat.</th><th>Medalha</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script src="assets/admin.js"></script><script>
side.innerHTML=sidebar('results');async function load(){try{const d=await adminApi('/resultados');rows.innerHTML=d.resultados.map(r=>`<tr><td>${r.colocacaoGeral??'—'}</td><td>${esc(r.numeroPeito)}</td><td>${esc(r.participante)}</td><td>${esc(r.categoriaNome||'')}</td><td>${esc(r.tempoTexto||'—')}</td><td>${r.colocacaoCategoria??'—'}</td><td>${esc(r.medalha)}</td></tr>`).join('');statusMsg(`${d.resultados.length} resultado(s)`)}catch(e){statusMsg(e.message,false)}}save.onclick=async()=>{try{await adminApi('/resultados/upsert',{method:'POST',body:JSON.stringify({numeroPeito:numeroPeito.value,tempo:tempo.value,colocacaoGeral:colocacaoGeral.value,colocacaoCategoria:colocacaoCategoria.value,distanciaKm:distanciaKm.value,status:status.value})});statusMsg('Resultado salvo');load()}catch(e){statusMsg(e.message,false)}};function csvParse(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);if(lines.length<2)return[];const sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';const headers=lines[0].split(sep).map(x=>x.trim());return lines.slice(1).map(l=>{const v=l.split(sep).map(x=>x.trim());const o={};headers.forEach((h,i)=>o[h]=v[i]||'');return o})}importBtn.onclick=async()=>{if(!csv.files[0])return statusMsg('Selecione um CSV.',false);try{const arr=csvParse(await csv.files[0].text());const d=await adminApi('/resultados/importar',{method:'POST',body:JSON.stringify({resultados:arr})});statusMsg(`${d.importados} resultado(s) importado(s); ${d.erros.length} erro(s)`);load()}catch(e){statusMsg(e.message,false)}};load();</script></body></html>
