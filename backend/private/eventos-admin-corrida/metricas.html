<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Métricas | CMS Axoriin Eventos</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oxanium:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/admin.css"><style>.metrics-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.metric-box{padding:18px;border:1px solid rgba(61,190,245,.28);background:linear-gradient(145deg,rgba(7,36,61,.95),rgba(4,18,33,.96));border-radius:16px}.metric-box small{display:block;color:#8da9c2;text-transform:uppercase;letter-spacing:.1em;font-size:10px}.metric-box strong{display:block;font:800 30px Oxanium;margin-top:8px}.live-box{border-color:rgba(54,242,146,.45);background:linear-gradient(145deg,rgba(5,55,45,.94),rgba(4,22,32,.97))}.live-box strong{color:#50f2a5}.analytics-layout{display:grid;grid-template-columns:1.4fr .6fr;gap:14px;margin-top:15px}.chart-card,.list-card{padding:20px}.chart-wrap{height:300px}.barlist{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center}.bar{height:10px;background:#0b2945;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#20d9ff,#35f19d)}.click-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}@media(max-width:1100px){.metrics-grid{grid-template-columns:repeat(2,1fr)}.analytics-layout,.click-grid{grid-template-columns:1fr}}@media(max-width:620px){.metrics-grid{grid-template-columns:1fr}.barrow{grid-template-columns:100px 1fr 50px}}</style></head><body><div class="admin-shell"><div id="side"></div><main class="admin-main"><div class="admin-top admin-top-v120"><div><div class="eyebrow">ANALYTICS DO EVENTO</div><h1>Métricas de acesso</h1><p>Acessos, usuários ao vivo, páginas mais vistas e cliques no site público.</p></div><div class="admin-top-actions"><select id="days" class="btn secondary"><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option></select><button class="btn primary" id="refresh">Atualizar</button></div></div><div id="saveState" class="save-state">Carregando métricas...</div><section class="metrics-grid" id="kpis"></section><section class="analytics-layout"><article class="panel chart-card"><div class="card-title-row"><div><div class="eyebrow">VISITAS POR DIA</div><h2>Acessos ao site</h2></div></div><div class="chart-wrap"><canvas id="chart" width="900" height="300"></canvas></div></article><article class="panel list-card"><div class="eyebrow">PÁGINAS MAIS ACESSADAS</div><h2 style="font-family:Oxanium">Top páginas</h2><div id="pages" class="barlist"></div></article></section><section class="click-grid"><article class="panel list-card"><div class="eyebrow">CLIQUES NO SITE</div><h2 style="font-family:Oxanium">Botões e ações</h2><div id="clicks" class="barlist"></div></article><article class="panel list-card"><div class="eyebrow">DISPOSITIVOS</div><h2 style="font-family:Oxanium">Origem dos acessos</h2><div id="devices" class="barlist"></div></article></section></main></div><script src="assets/admin.js"></script><script>side.innerHTML=sidebar('metrics');function fmt(n){return Number(n||0).toLocaleString('pt-BR')}function bars(el,rows){const max=Math.max(1,...rows.map(x=>x.value||0));el.innerHTML=rows.length?rows.map(x=>`<div class="barrow"><span>${esc(x.name||'—')}</span><div class="bar"><i style="width:${Math.max(3,Math.round((x.value/max)*100))}%"></i></div><strong>${fmt(x.value)}</strong></div>`).join(''):'<p class="muted">Sem dados ainda.</p>'}function draw(rows){const c=chart,ctx=c.getContext('2d'),w=c.width,h=c.height,pad=42;ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(130,180,220,.18)';ctx.fillStyle='#8da8c0';ctx.font='12px Inter';for(let i=0;i<5;i++){const y=pad+(h-pad*2)*i/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}if(!rows.length){ctx.fillText('Sem acessos no período.',pad+10,h/2);return}const max=Math.max(1,...rows.map(x=>x.value));const step=(w-pad*2)/Math.max(1,rows.length-1);ctx.beginPath();rows.forEach((r,i)=>{const x=pad+i*step,y=h-pad-(r.value/max)*(h-pad*2);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#21d9ff';ctx.lineWidth=3;ctx.shadowColor='#21d9ff';ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0;rows.forEach((r,i)=>{const x=pad+i*step,y=h-pad-(r.value/max)*(h-pad*2);ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle='#38f0a1';ctx.fill();if(rows.length<=14){ctx.fillStyle='#8da8c0';ctx.fillText(r.date.slice(5),x-14,h-15)}})}async function load(){try{statusMsg('Atualizando métricas...');const d=await adminApi(`/analytics?days=${days.value}`);kpis.innerHTML=[['Acessos totais',d.pageViews,'cyan'],['Acessos hoje',d.todayViews,'purple'],['Usuários ao vivo',d.live,'green'],['Cliques totais',d.totalClicks,'amber'],['Visitantes únicos',d.uniqueVisitors,'cyan']].map((x,i)=>`<article class="metric-box ${i===2?'live-box':''}"><small>${x[0]}</small><strong>${fmt(x[1])}${i===2?' ●':''}</strong></article>`).join('');bars(pages,d.topPages||[]);bars(clicks,d.topClicks||[]);bars(devices,d.devices||[]);draw(d.daily||[]);statusMsg('Métricas atualizadas')}catch(e){statusMsg(e.message,false)}}refresh.onclick=load;days.onchange=load;load();setInterval(load,30000);</script></body></html>
